<!DOCTYPE html>
<html lang="nl">
<head>
<script src="sw-register.js?v=20260812-6"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" id="theme-meta" content="#f2f2f2">
<title>Velios+ — Inloggen</title>
<link rel="icon" href="favicon.png">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f2f2f2;--card:#fff;--text:#1b1b1b;--muted:#666;--line:#8a8886;--soft:#e5e5e5;--accent:#0067b8;--accent-hover:#005da6;--danger:#c42b1c;--font:"Segoe UI",Arial,sans-serif}
body.dark-mode{--bg:#111;--card:#1f1f1f;--text:#fff;--muted:#b8b8b8;--line:#aaa;--soft:#3a3a3a}
html{font:15px var(--font);color:var(--text);background:var(--bg)}
body{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;background:var(--bg)}
.auth-shell{width:100%;max-width:440px}
.auth-card{min-height:360px;background:var(--card);padding:44px 44px 36px;box-shadow:0 2px 6px rgba(0,0,0,.18);overflow:hidden}
.brand{width:108px;height:auto;display:block;margin-bottom:28px}.dark-mode .brand{filter:invert(1)}
.step{animation:step-in .24s cubic-bezier(.2,.8,.2,1) both}@keyframes step-in{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}}
.account-line{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:14px;margin:-8px 0 14px}
.back{width:24px;height:24px;border:0;border-radius:50%;display:grid;place-items:center;background:transparent;color:var(--text);cursor:pointer}.back:hover{background:var(--soft)}.back svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2}
h1{font-size:24px;line-height:1.25;font-weight:600;margin-bottom:12px;letter-spacing:-.25px}
.lead{line-height:1.45;color:var(--text);margin-bottom:20px}.progress{font-size:12px;color:var(--muted);margin:-4px 0 16px}
.field{margin:18px 0 12px}.field label{display:block;font-size:14px;font-weight:600;margin-bottom:8px}
.field input{width:100%;height:38px;padding:6px 0;border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;color:var(--text);font:15px var(--font);outline:0}.field input:focus{border-bottom:2px solid var(--accent)}.field input::placeholder{color:var(--muted)}
.pw-row{position:relative}.pw-row input{padding-right:40px}.show-pw{position:absolute;right:0;top:0;width:36px;height:36px;border:0;background:transparent;color:var(--muted);cursor:pointer;display:grid;place-items:center}.show-pw svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8}
.error{min-height:18px;color:var(--danger);font-size:13px;line-height:1.35;margin-top:7px}
.links{font-size:13px;line-height:1.55;margin:15px 0}.links a,.link-btn{color:var(--accent);text-decoration:none;border:0;background:none;font:inherit;cursor:pointer;padding:0}.links a:hover,.link-btn:hover{text-decoration:underline}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:25px}.btn{min-width:108px;height:34px;padding:0 18px;border:0;font:600 14px var(--font);cursor:pointer}.btn.primary{background:var(--accent);color:#fff}.btn.primary:hover{background:var(--accent-hover)}.btn.secondary{background:var(--soft);color:var(--text)}.btn:disabled{opacity:.55;cursor:default}
.spinner{width:15px;height:15px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .65s linear infinite;margin:auto}@keyframes spin{to{transform:rotate(360deg)}}
.verify-icon{width:48px;height:48px;border-radius:50%;background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent);display:grid;place-items:center;margin-bottom:18px}.verify-icon svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.7}
.email-pill{font-weight:600;margin:8px 0 18px;overflow-wrap:anywhere}
.footer{font-size:12px;color:var(--muted);text-align:center;margin-top:18px}.footer a{color:inherit;text-decoration:none;margin:0 8px}.footer a:hover{text-decoration:underline}
#toast{position:fixed;right:24px;bottom:24px;max-width:min(360px,calc(100vw - 32px));padding:12px 16px;background:var(--card);border:1px solid var(--soft);box-shadow:0 4px 18px rgba(0,0,0,.18);opacity:0;transform:translateY(10px);pointer-events:none;transition:.2s}#toast.show{opacity:1;transform:none}#toast.err{color:var(--danger)}
@media(max-width:600px){body{justify-content:flex-start;padding:0;background:var(--card)}.auth-shell{max-width:none}.auth-card{min-height:auto;box-shadow:none;padding:calc(36px + env(safe-area-inset-top)) 28px 36px}.footer{margin-top:auto;padding:22px}.brand{margin-bottom:32px}}

/* Velios-uitwerking: dezelfde rustige stap-voor-stapflow, in de stijl van de app. */
:root{--bg:#f2f2f7;--card:#fff;--input-bg:#f7f7f8;--text:#0b1029;--muted:#6f7184;--line:#dedee6;--soft:#eeeef3;--accent:#0062ff;--accent-hover:#0058e6;--font:'DM Sans',sans-serif}
body.dark-mode{color-scheme:dark;color:#fff;--bg:#000;--card:#171719;--input-bg:#2c2c2e;--text:#fff;--muted:#b3b3bd;--line:#3b3b40;--soft:#29292d}
body{font-family:var(--font);background:var(--bg)}
.auth-shell{max-width:470px}.auth-card{min-height:390px;border:1px solid var(--line);border-radius:36px;padding:42px 44px 38px;box-shadow:none;color:var(--text)}
.brand{position:relative;display:block;width:112px;height:auto;margin-bottom:30px}.dark-mode .brand{filter:none}.brand-base{display:block;width:100%;height:auto}.dark-mode .brand-base{filter:invert(1) hue-rotate(180deg) brightness(1.55)}
.brand-plus{position:absolute;z-index:1;top:0;right:0;width:16.59%;aspect-ratio:1;background:var(--accent);-webkit-mask:url('assets/branding/logo_plus-mask.svg') center/contain no-repeat;mask:url('assets/branding/logo_plus-mask.svg') center/contain no-repeat;pointer-events:none}
h1{font-size:30px;font-weight:800;line-height:1.15;letter-spacing:-.7px;margin-bottom:12px}.lead{color:var(--muted);font-weight:500}
.account-line{color:var(--text);font-weight:600;margin-bottom:17px}.back{color:var(--text)}
.progress{font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.field{margin:20px 0 12px}.field label{font-weight:700;color:var(--text)}
.field input{height:50px;padding:0 18px;border:1px solid var(--line);border-radius:999px;background:var(--input-bg);color:var(--text);font:500 15px var(--font);caret-color:var(--accent)}
.field input:focus{border:1px solid var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 13%,transparent)}
.field input::placeholder{color:var(--muted);opacity:1}.pw-row input{padding-right:48px}.show-pw{right:6px;top:7px;color:var(--muted)}
.links{font-size:14px;font-weight:550;color:var(--text)}.links a,.link-btn{color:var(--accent);font-family:var(--font)}
.actions{margin-top:27px}.btn{height:44px;min-width:118px;border-radius:999px;font:750 14px var(--font)}.btn.primary{background:var(--accent)}.btn.primary:hover{background:var(--accent);filter:brightness(.94)}
.btn.secondary{background:var(--soft);color:var(--text)}.error{font-weight:600}.footer{font-family:var(--font)}
body.dark-mode .auth-card{background:#171719;border-color:#343439}body.dark-mode .field input{background:var(--input-bg);border-color:#44444a;color:#fff}body.dark-mode .field input:focus{border-color:var(--accent)}body.dark-mode .btn.secondary{background:#2b2b2f;color:#fff}
.field input:-webkit-autofill,.field input:-webkit-autofill:hover,.field input:-webkit-autofill:focus{-webkit-text-fill-color:var(--text);box-shadow:0 0 0 1000px var(--input-bg) inset;transition:background-color 9999s ease-out}
body.dark-mode .field input:-webkit-autofill,body.dark-mode .field input:-webkit-autofill:hover,body.dark-mode .field input:-webkit-autofill:focus{-webkit-text-fill-color:#fff;box-shadow:0 0 0 1000px var(--input-bg) inset}
@media(max-width:600px){body,body.dark-mode{background:var(--card)}.auth-card{border:0;border-radius:0;min-height:auto;padding:calc(38px + env(safe-area-inset-top)) 26px 42px}.auth-shell{max-width:none}.footer{padding-bottom:calc(22px + env(safe-area-inset-bottom))}}
</style>
</head>
<body>
<main class="auth-shell">
  <section class="auth-card" id="authCard" aria-live="polite"></section>
  <div class="footer"><a href="index.html">Velios+</a><a href="#">Privacy</a><a href="#">Voorwaarden</a></div>
</main>
<div id="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js?v=20260812-6"></script>
<script>
const state={mode:'login',step:0,busy:false,data:{email:'',username:'',displayName:'',password:'',confirm:''}};
const card=document.getElementById('authCard');
const emailPattern=/^[^\s@]+@[^\s@]+\.[^\s@]+$/;
const passwordPattern=/^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{8,64}$/;
let toastTimer;

function applyTheme(){
  let settings={};try{settings=JSON.parse(localStorage.getItem('sd_theme')||'{}')}catch(e){}
  const dark=settings.followSystem?matchMedia('(prefers-color-scheme: dark)').matches:!!settings.darkMode;
  document.body.classList.toggle('dark-mode',dark);
  document.getElementById('theme-meta').content=dark?'#111111':'#f2f2f2';
  if(settings.accentColor)document.documentElement.style.setProperty('--accent',settings.accentColor);
}
function esc(value){return String(value||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function logo(){return '<span class="brand" role="img" aria-label="Velios+"><img class="brand-base" src="assets/branding/logo_full-svg.svg" alt=""><span class="brand-plus" aria-hidden="true"></span></span>'}
function backLine(text){return `<div class="account-line"><button class="back" type="button" onclick="goBack()" aria-label="Terug"><svg viewBox="0 0 24 24"><path d="M19 12H5m6-6-6 6 6 6"/></svg></button><span>${esc(text)}</span></div>`}
function eyeButton(id){return `<button class="show-pw" type="button" onclick="togglePassword('${id}',this)" aria-label="Wachtwoord tonen"><svg viewBox="0 0 24 24"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.5"/></svg></button>`}
function field({id,label,type='text',placeholder='',autocomplete=''}){return `<div class="field">${label?`<label for="${id}">${label}</label>`:''}<div class="${type==='password'?'pw-row':''}"><input id="${id}" type="${type}" value="${esc(currentValue())}" placeholder="${placeholder}" autocomplete="${autocomplete}" autocapitalize="none" spellcheck="false">${type==='password'?eyeButton(id):''}</div><div class="error" id="fieldError"></div></div>`}
function buttons(primary,secondary=''){return `<div class="actions">${secondary?`<button class="btn secondary" type="button" onclick="goBack()">${secondary}</button>`:''}<button class="btn primary" id="primaryBtn" type="submit">${state.busy?'<span class="spinner"></span>':primary}</button></div>`}

function currentValue(){
  if(state.mode==='login')return state.step===0?state.data.email:state.data.password;
  if(state.mode==='forgot')return state.data.email;
  return [state.data.email,state.data.username,state.data.displayName,state.data.password,state.data.confirm][state.step]||'';
}
function render(){
  let html=logo();
  if(state.mode==='verify'){
    html+=`<div class="step"><div class="verify-icon"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/></svg></div><h1>Controleer je e-mail</h1><p class="lead">We hebben een bevestigingslink gestuurd naar:</p><div class="email-pill">${esc(state.data.email)}</div><p class="lead">Open de link om je account te activeren. Daarna kun je hier inloggen.</p><div class="actions"><button class="btn primary" type="button" onclick="finishVerification()">Terug naar inloggen</button></div></div>`;
  }else if(state.mode==='login'){
    if(state.step===0)html+=`<form class="step" onsubmit="submitStep(event)"><h1>Inloggen</h1>${field({id:'authInput',label:'',placeholder:'E-mailadres',autocomplete:'email'})}<div class="links">Nog geen account? <button class="link-btn" type="button" onclick="startRegister()">Maak er een.</button></div><div class="links"><button class="link-btn" type="button" onclick="startForgot()">Geen toegang tot je account?</button></div>${buttons('Volgende')}</form>`;
    else html+=`<form class="step" onsubmit="submitStep(event)">${backLine(state.data.email)}<h1>Wachtwoord invoeren</h1>${field({id:'authInput',label:'Wachtwoord',type:'password',placeholder:'Wachtwoord',autocomplete:'current-password'})}<div class="links"><button class="link-btn" type="button" onclick="startForgot()">Wachtwoord vergeten?</button></div>${buttons('Inloggen')}</form>`;
  }else if(state.mode==='forgot'){
    html+=`<form class="step" onsubmit="submitStep(event)">${backLine('Inloggen')}<h1>Je account herstellen</h1><p class="lead">Vul je e-mailadres in. Je ontvangt een link waarmee je een nieuw wachtwoord kunt kiezen.</p>${field({id:'authInput',label:'E-mailadres',placeholder:'naam@voorbeeld.nl',autocomplete:'email'})}${buttons('Volgende','Annuleren')}</form>`;
  }else{
    const fields=[
      {title:'Account maken',lead:'Gebruik een e-mailadres waarmee je straks kunt inloggen.',label:'E-mailadres',type:'text',placeholder:'naam@voorbeeld.nl',autocomplete:'email'},
      {title:'Kies een gebruikersnaam',lead:'Deze naam is zichtbaar in Velios+.',label:'Gebruikersnaam',type:'text',placeholder:'gebruikersnaam',autocomplete:'username'},
      {title:'Hoe mogen we je noemen?',lead:'Deze naam gebruiken we bijvoorbeeld op je dashboard.',label:'Weergavenaam',type:'text',placeholder:'Jouw naam',autocomplete:'name'},
      {title:'Maak een wachtwoord',lead:'Gebruik minimaal 8 tekens, met een hoofdletter, kleine letter en cijfer. Speciale tekens zijn toegestaan.',label:'Wachtwoord',type:'password',placeholder:'Wachtwoord',autocomplete:'new-password'},
      {title:'Bevestig je wachtwoord',lead:'Vul hetzelfde wachtwoord nog een keer in.',label:'Wachtwoord herhalen',type:'password',placeholder:'Wachtwoord herhalen',autocomplete:'new-password'}
    ];
    const f=fields[state.step];
    html+=`<form class="step" onsubmit="submitStep(event)">${backLine(state.step?state.data.email:'Inloggen')}<h1>${f.title}</h1><p class="lead">${f.lead}</p><div class="progress">Stap ${state.step+1} van ${fields.length}</div>${field({id:'authInput',...f})}${buttons(state.step===fields.length-1?'Account maken':'Volgende')}</form>`;
  }
  card.innerHTML=html;
  const input=document.getElementById('authInput');if(input&&!state.busy){input.focus();input.setSelectionRange?.(input.value.length,input.value.length)}
}
function saveInput(){
  const input=document.getElementById('authInput');if(!input)return;
  const value=input.value;
  if(state.mode==='login'){if(state.step===0)state.data.email=value.trim().toLowerCase();else state.data.password=value}
  else if(state.mode==='forgot')state.data.email=value.trim().toLowerCase();
  else ['email','username','displayName','password','confirm'].forEach((key,index)=>{if(index===state.step)state.data[key]=index<2?value.trim().toLowerCase():index===2?value.trim():value});
}
function setError(message){const el=document.getElementById('fieldError');if(el)el.textContent=message}
function setBusy(busy){state.busy=busy;render()}
async function briefLoad(){setBusy(true);await new Promise(resolve=>setTimeout(resolve,260));setBusy(false)}

async function submitStep(event){
  event.preventDefault();if(state.busy)return;saveInput();setError('');
  if(state.mode==='verify'){state.mode='login';state.step=0;state.data.password='';render();return}
  if(state.mode==='forgot'){await sendReset();return}
  if(state.mode==='login'){
    if(state.step===0){if(!emailPattern.test(state.data.email)){setError('Vul een geldig e-mailadres in.');return}await briefLoad();state.step=1;render();return}
    if(!state.data.password){setError('Vul je wachtwoord in.');return}await signIn();return;
  }
  await advanceRegistration();
}
async function advanceRegistration(){
  const {email,username,displayName,password,confirm}=state.data;
  if(state.step===0&&!emailPattern.test(email)){setError('Vul een geldig e-mailadres in.');return}
  if(state.step===1){
    if(!/^[a-z][a-z0-9_.]{2,19}$/.test(username)){setError('Gebruik 3–20 tekens en begin met een letter.');return}
    setBusy(true);try{if(await VeliosAuth.usernameExists(username)){setBusy(false);setError('Deze gebruikersnaam is al in gebruik.');return}}catch(e){setBusy(false);setError('Controleren is niet gelukt. Probeer het opnieuw.');return}setBusy(false);
  }
  if(state.step===2&&!displayName){setError('Vul een weergavenaam in.');return}
  if(state.step===3&&!passwordPattern.test(password)){setError('Gebruik minimaal 8 tekens met een hoofdletter, kleine letter en cijfer.');return}
  if(state.step===4&&confirm!==password){setError('De wachtwoorden komen niet overeen.');return}
  if(state.step<4){await briefLoad();state.step++;render();return}
  await register();
}
async function signIn(){
  setBusy(true);
  const {error}=await VeliosAuth.client.auth.signInWithPassword({email:state.data.email,password:state.data.password});
  if(error){setBusy(false);setError(error.message.includes('Email not confirmed')?'Bevestig eerst je e-mailadres via de link in je inbox.':'Het e-mailadres of wachtwoord klopt niet.');return}
  location.href='index.html';
}
async function register(){
  setBusy(true);
  const redirectTo=new URL('login.html',location.href).href;
  const {error}=await VeliosAuth.client.auth.signUp({email:state.data.email,password:state.data.password,options:{data:{username:state.data.username,display_name:state.data.displayName},emailRedirectTo:redirectTo}});
  if(error){setBusy(false);setError(error.message.includes('already registered')?'Dit e-mailadres is al in gebruik.':error.message);return}
  state.busy=false;state.mode='verify';render();
}
async function sendReset(){
  if(!emailPattern.test(state.data.email)){setError('Vul een geldig e-mailadres in.');return}
  setBusy(true);const redirectTo=new URL('account-options.html',location.href).href;
  const {error}=await VeliosAuth.client.auth.resetPasswordForEmail(state.data.email,{redirectTo});setBusy(false);
  if(error){setError(error.message);return}showToast('De resetlink is verstuurd.');state.mode='login';state.step=0;render();
}
function goBack(){
  if(state.busy)return;
  if(state.mode==='forgot'){state.mode='login';state.step=0}
  else if(state.mode==='register'){if(state.step>0)state.step--;else{state.mode='login';state.step=0}}
  else if(state.mode==='login'&&state.step>0){state.step=0;state.data.password=''}
  render();
}
function startRegister(){state.mode='register';state.step=0;state.data={email:state.data.email,username:'',displayName:'',password:'',confirm:''};render()}
function startForgot(){saveInput();state.mode='forgot';state.step=0;render()}
function finishVerification(){state.mode='login';state.step=0;state.data.password='';render()}
function togglePassword(id,button){const input=document.getElementById(id);const show=input.type==='password';input.type=show?'text':'password';button.setAttribute('aria-label',show?'Wachtwoord verbergen':'Wachtwoord tonen')}
function showToast(message,type=''){const toast=document.getElementById('toast');toast.textContent=message;toast.className='show '+type;clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.className='',3200)}

applyTheme();render();
</script>
</body>
</html>
