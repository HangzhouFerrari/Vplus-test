<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

.field input{width:100%;height:38px;padding:6px 0;border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;color:var(--text);font:15px var(--font);outline:0}.field input:focus{border-bottom:2px solid var(--accent)}.field input::placeholder{color:var(--muted)}
.pw-row{position:relative}.pw-row input{padding-right:40px}.show-pw{position:absolute;right:0;top:0;width:36px;height:36px;border:0;background:transparent;color:var(--muted);cursor:pointer;display:grid;place-items:center}.show-pw svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8}
.error{min-height:18px;color:var(--danger);font-size:13px;line-height:1.35;margin-top:7px}.error a,.error button{border:0;background:none;padding:0;color:var(--accent);font:inherit;font-weight:750;cursor:pointer;text-decoration:underline}.field-status{min-height:18px;color:#138a50;font-size:13px;line-height:1.35;font-weight:650;margin-top:7px}
.links{font-size:13px;line-height:1.55;margin:15px 0}.links a,.link-btn{color:var(--accent);text-decoration:none;border:0;background:none;font:inherit;cursor:pointer;padding:0}.links a:hover,.link-btn:hover{text-decoration:underline}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:25px}.btn{min-width:108px;height:34px;padding:0 18px;border:0;font:600 14px var(--font);cursor:pointer}.btn.primary{background:var(--accent);color:#fff}.btn.primary:hover{background:var(--accent-hover)}.btn.secondary{background:var(--soft);color:var(--text)}.btn:disabled{opacity:.55;cursor:default}
.spinner{width:15px;height:15px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .65s linear infinite;margin:auto}@keyframes spin{to{transform:rotate(360deg)}}
.verify-icon{width:48px;height:48px;border-radius:50%;background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent);display:grid;place-items:center;margin-bottom:18px}.verify-icon svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.7}
.email-pill{font-weight:600;margin:8px 0 18px;overflow-wrap:anywhere}
.social-auth{margin:20px 0 18px}.google-btn{width:100%;height:50px;border:1px solid var(--line);border-radius:999px;background:var(--input-bg);color:var(--text);display:flex;align-items:center;justify-content:center;gap:11px;font:750 14px var(--font);cursor:pointer;transition:border-color .18s ease,background .18s ease,transform .18s ease}.google-btn:hover{border-color:color-mix(in srgb,var(--text) 32%,var(--line));background:color-mix(in srgb,var(--input-bg) 92%,var(--text) 8%)}.google-btn:active{transform:scale(.985)}.google-btn:disabled{opacity:.58;cursor:default}.google-btn svg{width:20px;height:20px;flex:0 0 20px}.auth-divider{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12px;font-weight:650;margin:18px 0}.auth-divider::before,.auth-divider::after{content:'';height:1px;flex:1;background:var(--line)}.oauth-loading{min-height:210px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px}.oauth-loading .spinner{width:26px;height:26px;border-color:color-mix(in srgb,var(--accent) 28%,transparent);border-top-color:var(--accent)}.oauth-loading strong{font-size:18px}.oauth-loading span{color:var(--muted);font-size:13px}.auth-page-error{padding:11px 14px;margin:0 0 14px;border-radius:18px;background:color-mix(in srgb,var(--danger) 10%,transparent);color:var(--danger);font-size:13px;font-weight:650;line-height:1.4}
.auth-loading-skeleton{padding:0 0 4px}.auth-loading-skeleton i,.auth-loading-skeleton b{display:block;background:linear-gradient(100deg,color-mix(in srgb,var(--text) 7%,transparent) 20%,color-mix(in srgb,var(--text) 14%,transparent) 38%,color-mix(in srgb,var(--text) 7%,transparent) 56%);background-size:240% 100%;animation:authShimmer 1.3s ease infinite}.auth-skeleton-title{width:42%;height:35px;border-radius:13px;margin-bottom:20px}.auth-skeleton-google{width:100%;height:50px;border-radius:999px}.auth-skeleton-divider{height:12px;margin:18px 0;display:flex;align-items:center;gap:12px}.auth-skeleton-divider b{height:1px;flex:1;border-radius:1px}.auth-skeleton-divider i{width:22px;height:10px;border-radius:5px}.auth-skeleton-input{width:100%;height:50px;border-radius:999px;margin:20px 0 15px}.auth-skeleton-link{width:58%;height:14px;border-radius:7px;margin-top:15px}.auth-skeleton-link-short{width:49%;height:14px;border-radius:7px;margin-top:15px}.auth-skeleton-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:27px}.auth-skeleton-actions i{width:118px;height:44px;border-radius:999px}@keyframes authShimmer{to{background-position:-140% 0}}
#toast{position:fixed;right:24px;bottom:24px;max-width:min(360px,calc(100vw - 32px));padding:12px 16px;background:var(--card);border:1px solid var(--soft);box-shadow:0 4px 18px rgba(0,0,0,.18);opacity:0;transform:translateY(10px);pointer-events:none;transition:.2s}#toast.show{opacity:1;transform:none}#toast.err{color:var(--danger)}
@media(max-width:600px){body{justify-content:flex-start;padding:0;background:var(--card)}.auth-shell{max-width:none}.auth-card{min-height:auto;box-shadow:none;padding:calc(36px + env(safe-area-inset-top)) 28px 36px}.brand{margin-bottom:32px}}

/* Velios-uitwerking: dezelfde rustige stap-voor-stapflow, in de stijl van de app. */
:root{--bg:#f2f2f7;--card:#fff;--input-bg:#f7f7f8;--text:#0b1029;--muted:#6f7184;--line:#dedee6;--soft:#eeeef3;--accent:#ff9f0a;--accent-hover:#e47f00;--accent-contrast:#fff;--font:'DM Sans',sans-serif}

.auth-shell{max-width:470px}.auth-card{min-height:390px;border:1px solid var(--line);border-radius:36px;padding:42px 44px 38px;box-shadow:none;color:var(--text)}

h1{font-size:30px;font-weight:800;line-height:1.15;letter-spacing:-.7px;margin-bottom:12px}.lead{color:var(--muted);font-weight:500}
.account-line{color:var(--text);font-weight:600;margin-bottom:17px}.back{color:var(--text)}

.field input:focus{border:1px solid var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 13%,transparent)}
.field input::placeholder{color:var(--muted);opacity:1}.pw-row input{padding-right:48px}.show-pw{right:6px;top:7px;color:var(--muted)}
.links{font-size:14px;font-weight:550;color:var(--text)}.links a,.link-btn{color:var(--accent);font-family:var(--font)}
.actions{margin-top:27px}.btn{height:44px;min-width:118px;border-radius:999px;font:750 14px var(--font)}.btn.primary{background:var(--accent);color:var(--accent-contrast)}.btn.primary:hover{background:var(--accent);filter:brightness(.94)}

body.dark-mode .field input:-webkit-autofill,body.dark-mode .field input:-webkit-autofill:hover,body.dark-mode .field input:-webkit-autofill:focus{-webkit-text-fill-color:#fff;box-shadow:0 0 0 1000px var(--input-bg) inset}

<body>
<main class="auth-shell">
  <section class="auth-card" id="authCard" aria-live="polite"></section>
</main>
<div id="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="school-profile.js?v=20260821-2"></script>
<script src="velios-select.js?v=20260821-8"></script>
<script src="supabase-client.js?v=20260821-2"></script>
<script>
const state={mode:'initializing',step:0,busy:false,availabilityToken:0,pageError:'',oauthUser:null,oauthProfile:null,oauthFields:[],data:{email:'',username:'',displayName:'',birthDate:'',schoolClass:'',schoolProfile:'',password:'',confirm:'',avatarUrl:''}};
const card=document.getElementById('authCard');
const emailPattern=/^[^\s@]+@[^\s@]+\.[^\s@]+$/;
const passwordPattern=/^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{8,64}$/;
let toastTimer;
let availabilityTimer;

function withTimeout(promise,timeout=15000){
  return new Promise((resolve,reject)=>{
    const timer=setTimeout(()=>reject(new Error('auth_timeout')),timeout);
    Promise.resolve(promise).then(
      value=>{clearTimeout(timer);resolve(value)},
      error=>{clearTimeout(timer);reject(error)}
    );
  });
}

function waitForOAuthSession(timeout=6500){
  return new Promise(resolve=>{
    let settled=false,subscription=null,timer=0;
    const finish=session=>{
      if(settled)return;
      settled=true;
      clearTimeout(timer);
      subscription?.unsubscribe();
      resolve(session||null);
    };
    try{
      const listener=VeliosAuth.client.auth.onAuthStateChange((_event,session)=>{
        if(session?.user)finish(session);
      });
      subscription=listener?.data?.subscription||null;
    }catch(e){console.warn('OAuth-sessieluisteraar kon niet starten:',e)}
    timer=setTimeout(()=>finish(null),timeout);
  });
}

function randomAnimalAvatar(){
  const allAvatars=VeliosAuth?.AVATAR_OPTIONS||[];
  const avatars=allAvatars.filter(avatar=>avatar.group==='study');
  const choices=avatars.length?avatars:allAvatars;
  if(!choices.length)return '';
  const randomValue=globalThis.crypto?.getRandomValues?crypto.getRandomValues(new Uint32Array(1))[0]/4294967296:Math.random();
  return choices[Math.floor(randomValue*choices.length)].url;
}
function animalAvatarOrRandom(value){
  const resolved=VeliosAuth?.resolveAvatarUrl?.(value)||String(value||'');
  return (VeliosAuth?.AVATAR_OPTIONS||[]).some(avatar=>avatar.url===resolved)?resolved:randomAnimalAvatar();
}

function applyTheme(){
  let settings={};try{settings=JSON.parse(localStorage.getItem('sd_theme')||'{}')}catch(e){}
  const dark=settings.followSystem!==false?matchMedia('(prefers-color-scheme: dark)').matches:!!settings.darkMode;
  document.body.classList.toggle('dark-mode',dark);
  document.getElementById('theme-meta').content=dark?'#111111':'#f2f2f2';
  const accent=settings.accentColor==='#0062ff'&&!settings.accentWasChosen?'#ff9f0a':(settings.accentColor||'#ff9f0a');
  document.documentElement.style.setProperty('--accent',accent);
  const hex=accent.replace('#',''),r=parseInt(hex.slice(0,2),16),g=parseInt(hex.slice(2,4),16),b=parseInt(hex.slice(4,6),16);
  document.documentElement.style.setProperty('--accent-contrast','#fff');
}
function esc(value){return String(value||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function logo(){return '<span class="brand" role="img" aria-label="Velios+"><img class="brand-base" src="assets/branding/logo_full-svg.svg" alt=""><span class="brand-plus" aria-hidden="true"></span></span>'}
function backLine(text){return `<div class="account-line"><button class="back" type="button" onclick="goBack()" aria-label="Terug"><svg viewBox="0 0 24 24"><path d="M19 12H5m6-6-6 6 6 6"/></svg></button><span>${esc(text)}</span></div>`}
function eyeButton(id){return `<button class="show-pw" type="button" onclick="togglePassword('${id}',this)" aria-label="Wachtwoord tonen"><svg viewBox="0 0 24 24"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.5"/></svg></button>`}
function field({id,label,type='text',placeholder='',autocomplete=''}){return `<div class="field">${label?`<label for="${id}">${label}</label>`:''}<div class="${type==='password'?'pw-row':''}"><input id="${id}" type="${type}" value="${esc(currentValue())}" placeholder="${placeholder}" autocomplete="${autocomplete}" autocapitalize="none" spellcheck="false" oninput="handleAuthInput()">${type==='password'?eyeButton(id):''}</div><div class="error" id="fieldError"></div><div class="field-status" id="fieldStatus"></div></div>`}
function buttons(primary,back=false){return `<div class="actions"><button class="btn secondary" type="button" onclick="${back?'goBack()':"location.href='index.html'"}">${back?'Terug':'Annuleren'}</button><button class="btn primary" id="primaryBtn" type="submit">${state.busy?'<span class="spinner"></span>':primary}</button></div>`}
function googleButton(){return `<div class="social-auth"><button class="google-btn" type="button" onclick="startGoogleAuth()" ${state.busy?'disabled':''}><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M21.8 12.2c0-.7-.1-1.5-.2-2.2H12v4.2h5.5a4.7 4.7 0 0 1-2 3.1V20h3.3c1.9-1.8 3-4.4 3-7.8Z"/><path fill="#34A853" d="M12 22c2.7 0 5-.9 6.8-2.4l-3.3-2.6c-.9.6-2.1 1-3.5 1a6 6 0 0 1-5.6-4.1H3v2.7A10 10 0 0 0 12 22Z"/><path fill="#FBBC05" d="M6.4 13.9a6 6 0 0 1 0-3.8V7.4H3a10 10 0 0 0 0 9.2l3.4-2.7Z"/><path fill="#EA4335" d="M12 6c1.5 0 2.8.5 3.8 1.5l2.9-2.8A9.7 9.7 0 0 0 12 2a10 10 0 0 0-9 5.4l3.4 2.7A6 6 0 0 1 12 6Z"/></svg><span>Doorgaan met Google</span></button><div class="auth-divider"><span>of</span></div></div>`}
function oauthButtons(last){return `<div class="actions"><button class="btn secondary" type="button" onclick="${state.step?'oauthBack()':'cancelOAuthSetup()'}">${state.step?'Terug':'Annuleren'}</button><button class="btn primary" id="primaryBtn" type="submit">${state.busy?'<span class="spinner"></span>':last?'Afronden':'Volgende'}</button></div>`}

const OAUTH_FIELDS={
  username:{title:'Kies een gebruikersnaam',lead:'Deze naam is zichtbaar in Velios+.',label:'Gebruikersnaam',type:'text',placeholder:'gebruikersnaam',autocomplete:'username'},
  displayName:{title:'Hoe mogen we je noemen?',lead:'Deze naam gebruiken we bijvoorbeeld op je dashboard.',label:'Weergavenaam',type:'text',placeholder:'Jouw naam',autocomplete:'name'},
  birthDate:{title:'Wanneer ben je geboren?',lead:'Google deelt je geboortedatum niet met Velios+.',label:'Geboortedatum',type:'date',placeholder:'',autocomplete:'bday'},
  schoolClass:{title:'In welke klas zit je?',lead:'Zo zie je alleen vakken die voor jou relevant zijn.'},
  schoolProfile:{title:'Welk profiel volg je?',lead:'Je profiel bepaalt welke vakken standaard zichtbaar zijn.'}
};

const REGISTER_FIELDS={
  email:{title:'Account maken',lead:'Gebruik een e-mailadres waarmee je straks kunt inloggen.',label:'E-mailadres',type:'text',placeholder:'naam@voorbeeld.nl',autocomplete:'email'},
  username:{title:'Kies een gebruikersnaam',lead:'Deze naam is zichtbaar in Velios+.',label:'Gebruikersnaam',type:'text',placeholder:'gebruikersnaam',autocomplete:'username'},
  displayName:{title:'Hoe mogen we je noemen?',lead:'Deze naam gebruiken we bijvoorbeeld op je dashboard.',label:'Weergavenaam',type:'text',placeholder:'Jouw naam',autocomplete:'name'},
  birthDate:{title:'Wanneer ben je geboren?',lead:'Je geboortedatum helpt ons om je account passend in te stellen.',label:'Geboortedatum',type:'date',placeholder:'',autocomplete:'bday'},
  schoolClass:{title:'In welke klas zit je?',lead:'Zo zie je alleen vakken die voor jou relevant zijn.'},
  schoolProfile:{title:'Welk profiel volg je?',lead:'Je profiel bepaalt welke vakken standaard zichtbaar zijn.'},
  password:{title:'Maak een wachtwoord',lead:'Gebruik minimaal 8 tekens, met een hoofdletter, kleine letter en cijfer. Speciale tekens zijn toegestaan.',label:'Wachtwoord',type:'password',placeholder:'Wachtwoord',autocomplete:'new-password'},
  confirm:{title:'Bevestig je wachtwoord',lead:'Vul hetzelfde wachtwoord nog een keer in.',label:'Wachtwoord herhalen',type:'password',placeholder:'Wachtwoord herhalen',autocomplete:'new-password'}
};
function registrationKeys(){return ['email','username','displayName','birthDate','schoolClass',...(VeliosSchool.isUpper(state.data)?['schoolProfile']:[]),'password','confirm']}
function authSchoolPicker(key){
  const values=key==='schoolProfile'?['NT','NG','EM','CM']:['1','2','3','4','5','6','overig'];
  const current=state.data[key];
  return `<div class="auth-school-select">${VeliosSelect.markup({value:current,placeholder:key==='schoolClass'?'Selecteer je klas':'Selecteer je profiel',ariaLabel:key==='schoolClass'?'Klas':'Profiel',onChange:key==='schoolClass'?'chooseAuthSchoolClass':'chooseAuthSchoolProfile',options:values.map(value=>({value,label:value==='overig'?'Overig':key==='schoolClass'?`Klas ${value}`:value}))})}</div><div class="error" id="fieldError"></div>`;
}
function chooseAuthSchool(key,value){state.data[key]=value;if(key==='schoolClass'&&!['4','5','6'].includes(value))state.data.schoolProfile='';setError('');render()}
function chooseAuthSchoolClass(value){chooseAuthSchool('schoolClass',value)}
function chooseAuthSchoolProfile(value){chooseAuthSchool('schoolProfile',value)}

function currentValue(){
  if(state.mode==='oauthSetup')return state.data[state.oauthFields[state.step]]||'';
  if(state.mode==='login')return state.step===0?state.data.email:state.data.password;
  if(state.mode==='forgot')return state.data.email;
  return state.data[registrationKeys()[state.step]]||'';
}
function render(){
  let html=logo();
  if(state.mode==='initializing'||state.mode==='oauthRedirect'){
    html+=state.mode==='oauthRedirect'?`<div class="oauth-loading"><span class="spinner"></span><strong>Google wordt geopend…</strong><span>Een moment geduld.</span></div>`:`<div class="auth-loading-skeleton" aria-label="Aanmelding controleren"><i class="auth-skeleton-title"></i><i class="auth-skeleton-google"></i><span class="auth-skeleton-divider"><b></b><i></i><b></b></span><i class="auth-skeleton-input"></i><i class="auth-skeleton-link"></i><i class="auth-skeleton-link-short"></i><span class="auth-skeleton-actions"><i></i><i></i></span></div>`;
  }else if(state.mode==='verify'){
    html+=`<div class="step"><div class="verify-icon"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/></svg></div><h1>Controleer je e-mail</h1><p class="lead">We hebben een bevestigingslink gestuurd naar:</p><div class="email-pill">${esc(state.data.email)}</div><p class="lead">Open de link om je account te activeren. Daarna kun je hier inloggen.</p><div class="actions"><button class="btn primary" type="button" onclick="finishVerification()">Terug naar inloggen</button></div></div>`;
  }else if(state.mode==='login'){
    if(state.step===0)html+=`<form class="step" onsubmit="submitStep(event)"><h1>Inloggen</h1>${state.pageError?`<div class="auth-page-error">${esc(state.pageError)}</div>`:''}${googleButton()}${field({id:'authInput',label:'',placeholder:'E-mailadres',autocomplete:'email'})}<div class="links">Nog geen account? <button class="link-btn" type="button" onclick="startRegister()">Maak er een.</button></div><div class="links"><button class="link-btn" type="button" onclick="startForgot()">Geen toegang tot je account?</button></div>${buttons('Volgende')}</form>`;
    else html+=`<form class="step" onsubmit="submitStep(event)">${backLine(state.data.email)}<h1>Wachtwoord invoeren</h1>${field({id:'authInput',label:'Wachtwoord',type:'password',placeholder:'Wachtwoord',autocomplete:'current-password'})}<div class="links"><button class="link-btn" type="button" onclick="startForgot()">Wachtwoord vergeten?</button></div>${buttons('Inloggen')}</form>`;
  }else if(state.mode==='forgot'){
    html+=`<form class="step" onsubmit="submitStep(event)">${backLine('Inloggen')}<h1>Je account herstellen</h1><p class="lead">Vul je e-mailadres in. Je ontvangt een link waarmee je een nieuw wachtwoord kunt kiezen.</p>${field({id:'authInput',label:'E-mailadres',placeholder:'naam@voorbeeld.nl',autocomplete:'email'})}${buttons('Volgende',true)}</form>`;
  }else if(state.mode==='oauthSetup'){
    const key=state.oauthFields[state.step],f=OAUTH_FIELDS[key],last=state.step===state.oauthFields.length-1;
    html+=`<form class="step" onsubmit="submitStep(event)"><div class="account-line"><span>${esc(state.data.email)}</span></div><h1>${f.title}</h1><p class="lead">${f.lead}</p><div class="progress">Stap ${state.step+1} van ${state.oauthFields.length}</div>${key==='schoolClass'||key==='schoolProfile'?authSchoolPicker(key):field({id:'authInput',...f})}${oauthButtons(last)}</form>`;
  }else{
    const keys=registrationKeys(),key=keys[state.step],f=REGISTER_FIELDS[key];
    html+=`<form class="step" onsubmit="submitStep(event)">${backLine(state.step?state.data.email:'Inloggen')}<h1>${f.title}</h1><p class="lead">${f.lead}</p><div class="progress">Stap ${state.step+1} van ${keys.length}</div>${state.step===0?googleButton():''}${key==='schoolClass'||key==='schoolProfile'?authSchoolPicker(key):field({id:'authInput',...f})}${buttons(state.step===keys.length-1?'Account maken':'Volgende')}</form>`;
  }
  card.innerHTML=html;
  const input=document.getElementById('authInput');
  if(input&&!state.busy){
    input.focus();
    try{input.setSelectionRange?.(input.value.length,input.value.length)}catch(e){}
  }
}
function saveInput(){
  const input=document.getElementById('authInput');if(!input)return;
  const value=input.value;
  if(state.mode==='oauthSetup'){
    const key=state.oauthFields[state.step];state.data[key]=key==='username'?value.trim().toLowerCase():key==='displayName'?value.trim():value;
  }else if(state.mode==='login'){if(state.step===0)state.data.email=value.trim().toLowerCase();else state.data.password=value}
  else if(state.mode==='forgot')state.data.email=value.trim().toLowerCase();
  else {const key=registrationKeys()[state.step];if(key)state.data[key]=key==='email'||key==='username'?value.trim().toLowerCase():key==='displayName'?value.trim():value}
}
function setError(message){const el=document.getElementById('fieldError');if(el)el.textContent=message}
function setErrorHtml(message){const el=document.getElementById('fieldError');if(el)el.innerHTML=message}
function setStatus(message){const el=document.getElementById('fieldStatus');if(el)el.textContent=message}
function setBusy(busy){state.busy=busy;render()}
async function briefLoad(){setBusy(true);await new Promise(resolve=>setTimeout(resolve,260));setBusy(false)}

async function submitStep(event){
  event.preventDefault();if(state.busy)return;saveInput();setError('');
  if(state.mode==='oauthSetup'){await advanceOAuthSetup();return}
  if(state.mode==='verify'){state.mode='login';state.step=0;state.data.password='';render();return}
  if(state.mode==='forgot'){await sendReset();return}
  if(state.mode==='login'){
    if(state.step===0){if(!emailPattern.test(state.data.email)){setError('Vul een geldig e-mailadres in.');return}await briefLoad();state.step=1;render();return}
    if(!state.data.password){setError('Vul je wachtwoord in.');return}await signIn();return;
  }
  await advanceRegistration();
}
async function advanceRegistration(){
  const {email,username,displayName,birthDate,password,confirm,schoolClass,schoolProfile}=state.data;
  const keys=registrationKeys(),key=keys[state.step];
  if(key==='email'){
    if(!emailPattern.test(email)){setError('Vul een geldig e-mailadres in.');return}
    setBusy(true);const used=await VeliosAuth.emailExists(email);setBusy(false);
    if(used===true){setErrorHtml('Dit e-mailadres is al in gebruik. <button type="button" onclick="useExistingEmail()">Ga naar inloggen</button>');return}
  }
  if(key==='username'){
    if(!/^[a-z][a-z0-9_.]{2,19}$/.test(username)){setError('Gebruik 3–20 tekens en begin met een letter.');return}
    setBusy(true);try{if(await VeliosAuth.usernameExists(username)){setBusy(false);setError('Deze gebruikersnaam is al in gebruik.');return}}catch(e){setBusy(false);setError('Controleren is niet gelukt. Probeer het opnieuw.');return}setBusy(false);
  }
  if(key==='displayName'&&!displayName){setError('Vul een weergavenaam in.');return}
  if(key==='birthDate'){
    const birth=new Date(`${birthDate}T12:00:00`),now=new Date();
    if(!birthDate||Number.isNaN(birth.getTime())){setError('Vul je geboortedatum in.');return}
    if(birth>now){setError('Je geboortedatum kan niet in de toekomst liggen.');return}
    if(now.getFullYear()-birth.getFullYear()>120){setError('Controleer of je geboortedatum klopt.');return}
  }
  if(key==='schoolClass'&&!schoolClass){setError('Selecteer je klas.');return}
  if(key==='schoolProfile'&&!schoolProfile){setError('Selecteer je profiel.');return}
  if(key==='password'&&!passwordPattern.test(password)){setError('Gebruik minimaal 8 tekens met een hoofdletter, kleine letter en cijfer.');return}
  if(key==='confirm'&&confirm!==password){setError('De wachtwoorden komen niet overeen.');return}
  if(state.step<keys.length-1){await briefLoad();state.step++;render();return}
  await register();
}
async function signIn(){
  setBusy(true);
  try{
    const {error}=await withTimeout(VeliosAuth.client.auth.signInWithPassword({email:state.data.email,password:state.data.password}));
    if(error){setBusy(false);setError(error.message.includes('Email not confirmed')?'Bevestig eerst je e-mailadres via de link in je inbox.':'Het e-mailadres of wachtwoord klopt niet.');return}
    location.replace('index.html');
  }catch(error){
    console.error('Inloggen mislukt:',error);
    setBusy(false);
    setError(error?.message==='auth_timeout'?'Inloggen duurt te lang. Sluit eventuele andere Velios+-tabbladen en probeer het opnieuw.':'Inloggen kon geen verbinding maken. Controleer je internetverbinding en probeer het opnieuw.');
  }
}
async function register(){
  setBusy(true);
  const redirectTo=new URL('login.html',location.href).href;
  state.data.avatarUrl=state.data.avatarUrl||randomAnimalAvatar();
  const school=VeliosSchool.metadata(state.data);
  VeliosSchool.saveLocal(state.data);
  const {data,error}=await VeliosAuth.client.auth.signUp({email:state.data.email,password:state.data.password,options:{data:{username:state.data.username,display_name:state.data.displayName,birth_date:state.data.birthDate,avatar_url:state.data.avatarUrl,...school},emailRedirectTo:redirectTo}});
  if(error||data?.user?.identities?.length===0){setBusy(false);if(error?.message?.includes('already registered')||data?.user?.identities?.length===0)setErrorHtml('Dit e-mailadres is al in gebruik. <button type="button" onclick="useExistingEmail()">Ga naar inloggen</button>');else setError(error?.message||'Account maken is niet gelukt.');return}
  state.busy=false;state.mode='verify';render();
}
async function sendReset(){
  if(!emailPattern.test(state.data.email)){setError('Vul een geldig e-mailadres in.');return}
  setBusy(true);const redirectTo=new URL('account-options.html',location.href).href;
  const {error}=await VeliosAuth.client.auth.resetPasswordForEmail(state.data.email,{redirectTo});setBusy(false);
  if(error){setError(error.message);return}showToast('De resetlink is verstuurd.');state.mode='login';state.step=0;render();
}
function goBack(){
  if(state.busy)return;
  if(state.mode==='forgot'){state.mode='login';state.step=0}
  else if(state.mode==='register'){if(state.step>0)state.step--;else{state.mode='login';state.step=0}}
  else if(state.mode==='login'&&state.step>0){state.step=0;state.data.password=''}
  render();
}
function startRegister(){state.mode='register';state.step=0;state.data={email:state.data.email,username:'',displayName:'',birthDate:'',schoolClass:'',schoolProfile:'',password:'',confirm:'',avatarUrl:randomAnimalAvatar()};render()}
function useExistingEmail(){saveInput();state.mode='login';state.step=0;render()}
function handleAuthInput(){
  saveInput();setError('');setStatus('');clearTimeout(availabilityTimer);const token=++state.availabilityToken;
  const oauthUsername=state.mode==='oauthSetup'&&state.oauthFields[state.step]==='username';
  if(!oauthUsername&&(state.mode!=='register'||(state.step!==0&&state.step!==1)))return;
  availabilityTimer=setTimeout(async()=>{
    if(token!==state.availabilityToken)return;
    if(state.mode==='register'&&state.step===0){
      if(!emailPattern.test(state.data.email))return;
      const used=await VeliosAuth.emailExists(state.data.email);if(token!==state.availabilityToken)return;
      if(used===true)setErrorHtml('Dit e-mailadres is al in gebruik. <button type="button" onclick="useExistingEmail()">Ga naar inloggen</button>');
      else if(used===false)setStatus('Dit e-mailadres is beschikbaar.');
    }else{
      if(!/^[a-z][a-z0-9_.]{2,19}$/.test(state.data.username))return;
      try{const used=await VeliosAuth.usernameExists(state.data.username);if(token!==state.availabilityToken)return;used?setError('Deze gebruikersnaam is al in gebruik.'):setStatus('Deze gebruikersnaam is beschikbaar.')}catch(e){}
    }
  },420);
}
function startForgot(){saveInput();state.mode='forgot';state.step=0;render()}
function finishVerification(){state.mode='login';state.step=0;state.data.password='';render()}
function togglePassword(id,button){const input=document.getElementById(id);const show=input.type==='password';input.type=show?'text':'password';button.setAttribute('aria-label',show?'Wachtwoord verbergen':'Wachtwoord tonen')}
function showToast(message,type=''){const toast=document.getElementById('toast');toast.textContent=message;toast.className='show '+type;clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.className='',3200)}

async function startGoogleAuth(){
  if(state.busy)return;
  state.busy=true;state.mode='oauthRedirect';render();
  const redirectTo=new URL('login.html?oauth=google',location.href).href;
  try{
    const {data,error}=await withTimeout(VeliosAuth.client.auth.signInWithOAuth({provider:'google',options:{redirectTo,queryParams:{prompt:'select_account'}}}),12000);
    if(error)throw error;
    // Normaal navigeert Supabase zelf. Deze fallback helpt browsers die die
    // eerste navigatie blokkeren of uitstellen.
    if(data?.url)location.assign(data.url);
  }catch(error){
    console.error('Google-aanmelding starten mislukt:',error);
    state.busy=false;state.mode='login';
    state.pageError=error?.message==='auth_timeout'?'Google reageert niet. Probeer het opnieuw of gebruik je e-mailadres.':'Aanmelden met Google is niet gelukt. Probeer het opnieuw.';
    render();
  }
}

async function initializeAuthPage(){
  state.mode='initializing';render();
  const query=new URLSearchParams(location.search),hash=new URLSearchParams(location.hash.replace(/^#/,''));
  const isOAuthReturn=query.get('oauth')==='google'||query.has('code')||hash.has('access_token')||hash.has('refresh_token');
  const oauthError=query.get('error_description')||hash.get('error_description');
  if(oauthError){
    state.mode='login';state.pageError=decodeURIComponent(oauthError.replace(/\+/g,' '));
    history.replaceState(null,'',location.pathname);render();return;
  }
  try{
    let {data:{session}}=await withTimeout(VeliosAuth.client.auth.getSession(),8000);
    if(!session&&isOAuthReturn)session=await waitForOAuthSession();
    if(session?.user){await prepareSignedInUser(session.user);return}
  }catch(e){console.warn('Aanmelding controleren is niet gelukt:',e)}
  state.mode='login';state.busy=false;
  if(isOAuthReturn)state.pageError='Google heeft geen geldige aanmelding teruggestuurd. Probeer het opnieuw.';
  history.replaceState(null,'',location.pathname);
  render();
}

async function prepareSignedInUser(user){
  const meta=user.user_metadata||{};
  let profile=null;
  try{
    const {data}=await VeliosAuth.client.from('profiles').select('*').eq('id',user.id).maybeSingle();profile=data||null;
  }catch(e){console.warn('Profiel controleren is niet gelukt:',e)}
  const username=String(profile?.username||meta.username||'').trim().toLowerCase();
  const displayName=String(profile?.display_name||meta.display_name||meta.full_name||meta.name||'').trim();
  const birthDate=String(profile?.birth_date||meta.birth_date||'').slice(0,10);
  const schoolClass=String(profile?.school_class||meta.school_class||'').toLowerCase();
  const schoolProfile=String(profile?.school_profile||meta.school_profile||'').toUpperCase();
  const avatarUrl=animalAvatarOrRandom(profile?.avatar_url||meta.avatar_url);
  const fields=[];
  if(!username)fields.push('username');
  if(!displayName)fields.push('displayName');
  if(!birthDate)fields.push('birthDate');
  if(!schoolClass)fields.push('schoolClass');
  else if(['4','5','6'].includes(schoolClass)&&!schoolProfile)fields.push('schoolProfile');
  if(!fields.length&&profile?.id){location.replace('index.html');return}
  state.oauthUser=user;state.oauthProfile=profile;state.oauthFields=fields.length?fields:['username'];state.step=0;state.busy=false;
  state.data={email:user.email||'',username,displayName,birthDate,schoolClass,schoolProfile,password:'',confirm:'',avatarUrl};
  state.mode='oauthSetup';history.replaceState(null,'',location.pathname);render();
}

async function advanceOAuthSetup(){
  const key=state.oauthFields[state.step],value=state.data[key];
  if(key==='username'){
    if(!/^[a-z][a-z0-9_.]{2,19}$/.test(value)){setError('Gebruik 3–20 tekens en begin met een letter.');return}
    setBusy(true);
    try{if(await VeliosAuth.usernameExists(value)){setBusy(false);setError('Deze gebruikersnaam is al in gebruik.');return}}
    catch(e){setBusy(false);setError('Controleren is niet gelukt. Probeer het opnieuw.');return}
    setBusy(false);
  }
  if(key==='displayName'&&!value){setError('Vul een weergavenaam in.');return}
  if(key==='birthDate'){
    const birth=new Date(`${value}T12:00:00`),now=new Date();
    if(!value||Number.isNaN(birth.getTime())){setError('Vul je geboortedatum in.');return}
    if(birth>now){setError('Je geboortedatum kan niet in de toekomst liggen.');return}
    if(now.getFullYear()-birth.getFullYear()>120){setError('Controleer of je geboortedatum klopt.');return}
  }
  if(key==='schoolClass'){
    if(!value){setError('Selecteer je klas.');return}
    if(['4','5','6'].includes(value)&&!state.oauthFields.includes('schoolProfile'))state.oauthFields.splice(state.step+1,0,'schoolProfile');
  }
  if(key==='schoolProfile'&&!value){setError('Selecteer je profiel.');return}
  if(state.step<state.oauthFields.length-1){await briefLoad();state.step++;render();return}
  await saveOAuthProfile();
}

async function saveOAuthProfile(){
  setBusy(true);
  const avatarUrl=state.data.avatarUrl||randomAnimalAvatar();
  const school=VeliosSchool.metadata(state.data);VeliosSchool.saveLocal(state.data);
  const user=state.oauthUser,meta={...(user.user_metadata||{}),username:state.data.username,display_name:state.data.displayName,birth_date:state.data.birthDate,avatar_url:avatarUrl,...school};
  const profileValues={username:state.data.username,display_name:state.data.displayName,avatar_url:avatarUrl};
  try{
    let profileError=null;
    if(state.oauthProfile?.id){
      ({error:profileError}=await VeliosAuth.client.from('profiles').update(profileValues).eq('id',user.id));
    }else{
      ({error:profileError}=await VeliosAuth.client.from('profiles').insert({id:user.id,email:user.email||state.data.email,...profileValues}));
    }
    if(profileError)throw profileError;
    const {error:metadataError}=await VeliosAuth.client.auth.updateUser({data:meta});
    if(metadataError)throw metadataError;
    location.replace('index.html');
  }catch(e){
    console.error('Google-profiel opslaan mislukt:',e);
    state.busy=false;render();
    const duplicate=e?.code==='23505'||/duplicate|unique|username/i.test(e?.message||'');
    setError(duplicate?'Deze gebruikersnaam is inmiddels in gebruik. Kies een andere.':'Je profiel kon niet worden opgeslagen. Probeer het opnieuw.');
  }
}

function oauthBack(){if(state.busy||state.step<1)return;saveInput();state.step--;render()}
async function cancelOAuthSetup(){if(state.busy)return;await VeliosAuth.client.auth.signOut({scope:'local'});state.mode='login';state.step=0;state.oauthUser=null;state.oauthProfile=null;state.oauthFields=[];state.pageError='';render()}

applyTheme();initializeAuthPage();
</script>
