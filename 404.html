<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, minimum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f0eef9" id="theme-color-meta">
<title>Pagina niet gevonden — Velios+</title>
<link rel="icon" href="favicon.png">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg-grad:linear-gradient(160deg,#f0eef9 0%,#ddd8f0 50%,#cfc8e8 100%);
  --glass:rgba(255,255,255,0.90);
  --glass2:rgba(255,255,255,0.80);
  --glass-border:rgba(200,195,230,0.6);
  --text:#0b0f2a;--text2:#3d3a55;--text3:#7c7899;
  --accent:#ff9f0a;--accent2:#e47f00;--accent-light:rgba(255,159,10,0.14);
  --glass-shadow:0 2px 8px rgba(0,98,255,0.1),inset 1px 1px 0 rgba(255,255,255,1),inset -1px -1px 2px rgba(255,255,255,0.5);
  --glass-shadow-lg:0 8px 32px rgba(0,98,255,0.15),inset 1px 1px 0 rgba(255,255,255,1),inset -1px -1px 2px rgba(255,255,255,0.5);
  --r:30px;--r2:36px;--r3:34px;--r4:30px;
  --font:'DM Sans',sans-serif;
  --ease:cubic-bezier(0,0,.47,1.15);
  --ease2:cubic-bezier(0.34,1.56,0.64,1);
}
html{min-height:100vh;font-family:var(--font);color:var(--text);font-size:16px;overflow-x:hidden;touch-action:manipulation;-webkit-tap-highlight-color:transparent;scrollbar-gutter:stable;}
body{min-height:100vh;background:var(--bg-grad);background-attachment:fixed;display:flex;flex-direction:column;}

/* ── DARK MODE (volgt de voorkeur uit de app) ── */
body.dark-mode{}
body.dark-mode nav{background:var(--glass) !important;border-color:var(--glass-border) !important}
body.dark-mode .sidebar{background:rgba(20,18,28,1) !important;border-right-color:var(--glass-border) !important}
body.dark-mode .nf-card{background:var(--glass2) !important;border-color:var(--glass-border) !important}
body.dark-mode .nf-icon-wrap{background:rgba(0,98,255,0.12) !important}

nav{
  position:sticky;top:0;z-index:200;
  background:rgb(250, 248, 255);
  border-bottom:2px solid rgba(200,195,230,0.5);
  padding: env(safe-area-inset-top, 0px) 28px 0;
  height: calc(72px + env(safe-area-inset-top, 0px));
  display:flex;align-items:center;justify-content:space-between;
}
.nav-logo{max-height:50px;height:100%;width:auto;display:flex;align-items:center;gap:8px}
.nav-logo-svg{height:80%;width:auto;display:block}
.nav-actions{display:flex;gap:8px;align-items:center}
.menu-trigger-btn{
  width:40px;height:40px;padding:0;border-radius:var(--r3);
  background:var(--glass);border:1.5px solid var(--glass-border);
  box-shadow:var(--glass-shadow);cursor:pointer;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  transition:all .2s var(--ease);color:var(--accent);
  text-decoration:none;flex-shrink:0;
}
.menu-trigger-btn:hover{transform:scale(1.08);box-shadow:var(--glass-shadow-lg)}

.sidebar{
  position:fixed;left:0;top:64px;z-index:180;
  width:80px;height:calc(100vh - 64px);
  background:linear-gradient(180deg,rgba(240,238,249,1) 0%,rgba(230,225,245,1) 100%);
  border-right:2px solid rgba(200,195,230,0.5);
  display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 8px;
}
.sidebar-btn{
  width:56px;height:56px;border-radius:16px;background:transparent;border:none;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  cursor:pointer;transition:all .2s;font-size:24px;color:var(--text2);font-weight:700;
  text-decoration:none;
}
.sidebar-btn:hover{color:var(--accent)}
@media(min-width:750px){.sidebar-btn:hover{transform:scale(1.1)}}
.sidebar-label{font-size:9px;color:var(--text2);font-weight:700;margin-top:4px;text-align:center;letter-spacing:-0.5px;max-width:60px}

.screen{padding:28px 32px;max-width:1200px;margin:0 auto;width:100%;margin-left:80px;flex:1;display:flex;align-items:center;justify-content:center}
@keyframes pageIn{from{opacity:0;transform:scale(0.94) translateY(20px)}to{opacity:1;transform:scale(1) translateY(0)}}
.page-enter{animation:pageIn .4s var(--ease2) both}

.nf-card{
  background:var(--glass);border:1px solid var(--glass-border);border-radius:var(--r2);
  box-shadow:var(--glass-shadow);
  padding:56px 48px;max-width:480px;width:100%;text-align:center;
}
.nf-icon-wrap{
  width:84px;height:84px;border-radius:24px;background:var(--accent-light);
  display:flex;align-items:center;justify-content:center;margin:0 auto 28px;
}
.nf-eyebrow{
  font-size:12px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;
  color:var(--accent);margin-bottom:10px;
}
.nf-title{font-size:28px;font-weight:800;letter-spacing:-0.5px;margin-bottom:12px;line-height:1.2}
.nf-desc{font-size:15px;color:var(--text2);line-height:1.6;margin-bottom:32px}
.btn{display:inline-flex;align-items:center;gap:6px;border:none;border-radius:var(--r3);cursor:pointer;font-family:var(--font);font-size:14px;font-weight:700;padding:13px 26px;transition:all .2s var(--ease);outline:none;white-space:nowrap;text-decoration:none}
.btn-primary{background:linear-gradient(180deg,var(--accent) 0%,var(--accent2) 100%);color:#fff}
.btn-primary:hover{filter:brightness(1.15);transform:scale(1.04) translateY(-1px)}
.btn-glass{background:var(--glass2);color:var(--text);border:2px solid var(--glass-border)}
.btn-glass:hover{background:rgba(255,255,255,0.95)}
.nf-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

@media(max-width:750px){
  nav{padding:env(safe-area-inset-top, 0px) 16px 0}
  .screen{padding:16px;margin-left:0}
  .sidebar{
    position:fixed;left:24px;right:24px;bottom:22px;top:auto;width:auto;max-width:500px;
    margin:0 auto;height:64px;display:flex;flex-direction:row;justify-content:space-around;
    align-items:center;background:rgba(255,255,255,1);border:2px solid var(--glass-border);
    border-radius:32px;box-shadow:0 8px 32px 0 rgba(0,0,0,0.2);padding:0 16px;box-sizing:border-box;
  }
  .sidebar .sidebar-btn{width:auto;height:100%;border-radius:0;flex:1}
  .nf-card{padding:40px 28px}
  .nf-title{font-size:23px}
}
</style>

<script>
/* Past dezelfde donkere-modus-voorkeur toe als de rest van Velios+,
   zodat deze pagina er nooit los van uitziet. */
(function(){
  try{
    const saved=JSON.parse(localStorage.getItem('sd_theme')||'{}');
    const root=document.documentElement.style;
    const dark=saved.followSystem!==false?window.matchMedia('(prefers-color-scheme: dark)').matches:!!saved.darkMode;
    if(dark){
      document.body.classList.add('dark-mode');
      document.getElementById('theme-color-meta')?.setAttribute('content','#0a0812');
      root.setProperty('--bg-grad','linear-gradient(180deg, rgb(10,10,10) 0%, rgb(10,8,18) 100%)');
      root.setProperty('--glass','rgb(34,33,41)');
      root.setProperty('--glass2','rgba(34,33,41,0.90)');
      root.setProperty('--text','#ffffff');
      root.setProperty('--text2','#e9e9e9');
      root.setProperty('--text3','rgba(255,255,255,0.65)');
      root.setProperty('--glass-border','rgba(64,73,112,0.5)');
    }
    const accent=saved.accentColor==='#0062ff'&&!saved.accentWasChosen?'#ff9f0a':(saved.accentColor||'#ff9f0a');
    if(accent){
      const hex=accent.replace('#','');
      const r=parseInt(hex.substr(0,2),16),g=parseInt(hex.substr(2,2),16),b=parseInt(hex.substr(4,2),16);
      root.setProperty('--accent',accent);
      root.setProperty('--accent2',`rgb(${Math.max(0,r-20)},${Math.max(0,g-20)},${Math.max(0,b-20)})`);
      root.setProperty('--accent-light',`rgba(${r},${g},${b},0.12)`);
    }
  }catch(e){}
})();
</script>
