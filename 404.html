<!DOCTYPE html>
<html lang="nl">
<head>
  <script src="sw-register.js?v=20260821-9"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta id="theme-color-meta" name="theme-color" content="#f2f2f7">
  <title>Pagina niet gevonden | Velios+</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="favicon.svg" media="(prefers-color-scheme: light)">
  <link rel="icon" href="favicon-dark.svg" media="(prefers-color-scheme: dark)">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..950&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#f2f2f7;--surface:#fff;--text:#0b0f2a;--text2:#666777;--line:#dedee7;--accent:#ff9f0a;--accent-light:rgba(255,159,10,.13);font-family:'DM Sans',sans-serif;color:var(--text)}
    body.dark-mode{--bg:#000;--surface:#171719;--text:#fff;--text2:#b3b3bd;--line:#343439;color-scheme:dark}
    body{min-height:100dvh;background:var(--bg);overflow:hidden;color:var(--text)}
    header{height:calc(78px + env(safe-area-inset-top));padding:env(safe-area-inset-top) max(24px,env(safe-area-inset-right)) 0 max(24px,env(safe-area-inset-left));display:flex;align-items:center;border-bottom:1px solid var(--line)}
    .brand{position:relative;width:116px;display:block}.brand img{display:block;width:100%}.dark-mode .brand img{filter:invert(1)}.brand-plus{position:absolute;top:0;right:0;width:16.6%;aspect-ratio:1;background:var(--accent);-webkit-mask:url('assets/branding/logo_plus-mask.svg') center/contain no-repeat;mask:url('assets/branding/logo_plus-mask.svg') center/contain no-repeat}
    main{position:relative;min-height:calc(100dvh - 78px - env(safe-area-inset-top));display:grid;place-items:center;padding:32px max(24px,env(safe-area-inset-right)) max(40px,env(safe-area-inset-bottom)) max(24px,env(safe-area-inset-left));isolation:isolate}
    main::before,main::after{content:'';position:absolute;width:min(55vw,620px);aspect-ratio:1;border-radius:50%;filter:blur(80px);opacity:.18;z-index:-1}main::before{background:var(--accent);left:-14%;bottom:-50%}main::after{background:#ff5a76;right:-16%;top:-58%}
    .error{width:min(720px,100%);text-align:center}.code{font-size:clamp(105px,24vw,230px);font-weight:950;line-height:.82;letter-spacing:normal;color:var(--accent);opacity:.14;user-select:none;margin-bottom:28px}
    h1{font-size:clamp(34px,6vw,58px);letter-spacing:normal;line-height:1.08;margin-bottom:14px}p{max-width:550px;margin:auto;color:var(--text2);font-size:clamp(15px,2vw,17px);line-height:1.55}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:30px}.btn{min-height:48px;padding:0 24px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;font-size:14px;font-weight:800}.primary{background:var(--accent);color:#fff}.secondary{background:var(--surface);border:1px solid var(--line);color:var(--text)}
    @media(max-width:560px){header{height:calc(70px + env(safe-area-inset-top))}.brand{width:104px}.actions{flex-direction:column}.btn{width:100%}.code{line-height:.9}}
    @media(prefers-reduced-motion:no-preference){.error{animation:enter .48s cubic-bezier(.22,1,.36,1) both}@keyframes enter{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}}
  </style>
</head>
<body>
  <header><a class="brand" href="index.html#home" aria-label="Velios+ dashboard"><img src="assets/branding/logo_full-svg.svg" alt="Velios+"><span class="brand-plus"></span></a></header>
  <main><section class="error"><div class="code" aria-hidden="true">404</div><h1>Deze pagina bestaat niet</h1><p>De link klopt misschien niet meer. Ga terug naar je dashboard of open de bestanden om verder te leren.</p><div class="actions"><a class="btn primary" href="index.html#home">Naar dashboard</a><a class="btn secondary" href="index.html#library">Naar bestanden</a></div></section></main>
  <script>(function(){try{const saved=JSON.parse(localStorage.getItem('sd_theme')||'{}');const dark=saved.followSystem!==false?matchMedia('(prefers-color-scheme:dark)').matches:!!saved.darkMode;document.body.classList.toggle('dark-mode',dark);document.getElementById('theme-color-meta').content=dark?'#000000':'#f2f2f7';const accent=saved.accentColor==='#0062ff'&&!saved.accentWasChosen?'#ff9f0a':(saved.accentColor||'#ff9f0a');document.documentElement.style.setProperty('--accent',accent);document.documentElement.style.setProperty('--accent-light',`color-mix(in srgb,${accent} 13%,transparent)`)}catch(e){}})();</script>
</body>
</html>
